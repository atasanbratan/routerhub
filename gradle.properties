org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The Kotlin stdlib is part of the host-provided "platform" (see README). Every module declares it
# explicitly, so extensions can take it as compileOnly instead of silently bundling a second copy.
kotlin.stdlib.default.dependency=false

# SHA-256 fingerprints (hex, colons optional, comma-separated) of the certificates allowed to sign
# official extensions. Set the real value in ~/.gradle/gradle.properties or pass -P on CI.
routerhub.officialSigners=
