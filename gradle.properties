org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The Kotlin stdlib is part of the host-provided "platform" (see README). Every module declares it
# explicitly, so extensions can take it as compileOnly instead of silently bundling a second copy.
kotlin.stdlib.default.dependency=false

# SHA-256 fingerprints (hex, colons optional, comma-separated) of the certificates allowed to sign
# official extensions. This one is the key the routerhub-extensions repository signs its releases with;
# a fork that publishes its own extensions replaces or adds to it.
routerhub.officialSigners=7F:3B:12:B9:54:80:3F:03:AB:99:96:56:3F:83:4C:7E:D2:37:AD:55:EB:E6:31:A2:CC:4C:26:EE:FB:EF:0E:39
