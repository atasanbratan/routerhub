name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Test the SDK, build the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Test router-api and the app, assemble the debug app
        run: ./gradlew :router-api:test :app:testGithubDebugUnitTest :app:assembleGithubDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: routerhub-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error

  play:
    name: Build the Play variant (extensions built in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: atasanbratan/routerhub-extensions
          path: routerhub-extensions
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble the Play debug app
        run: ./gradlew :app:assemblePlayDebug -Prouterhub.extensions=routerhub-extensions --stacktrace
      - name: Check it doesn't ask to see every installed app
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          if "$aapt2" dump permissions app/build/outputs/apk/play/debug/app-play-debug.apk | grep QUERY_ALL_PACKAGES; then
            echo "::error::The Play build must not request QUERY_ALL_PACKAGES"
            exit 1
          fi

  sdk:
    name: Publish router-api (as JitPack does)
    runs-on: ubuntu-latest
    env:
      # JitPack has no Android SDK, so settings.gradle.kts leaves the app out when this is set.
      JITPACK: "true"
      VERSION: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish the SDK to the local Maven repository
        run: ./gradlew :router-api:publishToMavenLocal --stacktrace
      - name: Check what was published
        run: |
          ls -l ~/.m2/repository/com/github/atasanbratan/routerhub/ci/
          test -f ~/.m2/repository/com/github/atasanbratan/routerhub/ci/routerhub-ci.jar
          test -f ~/.m2/repository/com/github/atasanbratan/routerhub/ci/routerhub-ci-sources.jar
