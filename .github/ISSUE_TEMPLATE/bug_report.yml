name: Bug report
description: Something in the app does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Bugs in a specific router's extension (TP-Link, OpenWrt, Demo) belong in the
        [extensions repository](https://github.com/atasanbratan/routerhub-extensions/issues/new/choose).

        **Please remove anything personal** from what you paste: Wi-Fi names and passwords, router passwords,
        public IP addresses, serial numbers and MAC addresses.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown under More.
      placeholder: "0.1.0 (debug)"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 14, Pixel 7"
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension and router
      description: Which extension (and version), and which router and firmware, if it matters.
      placeholder: "TP-Link ADSL2+ 1.0.0, TD-W8960N"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        A screenshot helps a lot. For crashes, `adb logcat -d | grep -i routerhub` is useful.
        Remove anything personal first.
      render: shell
    validations:
      required: false
