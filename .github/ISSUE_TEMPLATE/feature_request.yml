name: Feature request
description: An idea for the app or for the extension contract
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Support for a new router is a separate thing: that is an extension, and requests for
        one go to the [extensions repository](https://github.com/atasanbratan/routerhub-extensions/issues/new/choose).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first. A solution that fits it will be easier to find.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I would be willing to work on this
